volumes:
  medivault_db:
    name: medivault_db_storage

services:
  
  postgres:
    container_name: postgres
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medchain_db
    ports:
      - "${POSTGRES_PORT}:5432"  
    volumes:
      - medivault_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # solana:
  #   container_name: solana
  #   image: solanalabs/solana:v1.16.21
  #   ports:
  #     - "8899:8899"
  #   command: solana-test-validator --rpc-port 8899 --no-bpf-jit

  medivault:
    build: ./app
    container_name: medivault
    depends_on:
      postgres:
        condition: service_healthy
      # solana:
      #   condition: service_started
    entrypoint: >
      gunicorn -b 0.0.0.0:8300 main:app
      --workers=1 --threads=2 --worker-class=gthread
      --reload --timeout 120 --access-logfile '-'
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/medchain_db${DATABASE_ENVIRONMENT_SUFFIX}  # Corrigido
      - AMAZON_S3_ACCESS_KEY_ID=${MEDICAL_RECORDS_API_AMAZON_S3_ACCESS_KEY_ID}  # Corrigido
      - AMAZON_S3_SECRET_ACCESS_KEY=${MEDICAL_RECORDS_API_AMAZON_S3_SECRET_ACCESS_KEY}  # Corrigido
      - AMAZON_S3_MEDICAL_RECORD_FILES_BUCKET_ID=${MEDICAL_RECORDS_API_AMAZON_S3_MEDICAL_RECORD_FILES_BUCKET_ID}  # Corrigido
