volumes:
  medivault_db:
    name: medivault_db_storage
  solana_data:
    name: solana_data_storage
  solana_config:
    name: solana_config_storage

services:

  postgres:
    container_name: postgres
    environment:
      MYSQL_ROOT_PASSWORD: ${POSTGRES_PASSWORD}
    image: postgres:13
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    volumes:
      - medivault_db:/var/lib/postgresql

  solana:
    container_name: solana
    image: solanalabs/solana:latest
    ports:
      - "8899:8899"
    volumes:
      - solana_data:/root/.local/share/solana
      - solana_config:/root/.config/solana
    command: >
      solana-validator
      --rpc-port 8899
      --ledger /root/.local/share/solana/ledger
      --identity /root/.config/solana/validator-keypair.json
      --entrypoint entrypoint.mainnet-beta.solana.com:8001
  medivault:
    build: ${WORKSPACE}/mediVault/
    container_name: medivault
    depends_on:
      - postgres
      - solana
    entrypoint: gunicorn -b 0.0.0.0:8300 medivault:app --workers=1 --threads=4 --worker-class=gthread --worker-tmp-dir /dev/shm --access-logfile '-' --reload --timeout 600
    environment:
      - SQLALCHEMY_DATABASE_URI=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/atena${DATABASE_ENVIRONMENT_SUFFIX}
      - AMAZON_S3_ACCESS_KEY_ID=${MEDICAL_RECORDS_API_AMAZON_S3_ACCESS_KEY_ID}
      - AMAZON_S3_MEDICAL_RECORD_FILES_BUCKET_ID=${MEDICAL_RECORDS_API_AMAZON_S3_MEDICAL_RECORD_FILES_BUCKET_ID}
      - AMAZON_S3_SECRET_ACCESS_KEY=${MEDICAL_RECORDS_API_AMAZON_S3_SECRET_ACCESS_KEY}
    ports:
      - "8300:8300"
    stdin_open: true
    tty: true
    volumes:
      - ${WORKSPACE}/mediVault/:/mediVault
